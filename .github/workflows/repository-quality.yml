name: Repository quality
on: [push, pull_request, workflow_dispatch]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m unittest discover -s tests -v
      - run: python tools/validate_repository.py
      - run: python scripts/reproduce.py --suite canonical --output rerun/results --no-plots
      - run: python tools/validate_results.py --regenerated rerun/results
